[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "toolswap"
version = "0.1.0"
description = "Local-first recovery benchmark for stateful tool failures"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "jsonschema>=4.23,<5",
    "pydantic>=2.11,<3",
    "pyyaml>=6.0.2,<7",
    "typer>=0.15,<1",
]

[project.scripts]
toolswap = "toolswap.cli:main"

[project.optional-dependencies]
mlx = [
    "huggingface-hub>=1,<2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[dependency-groups]
dev = [
    "hypothesis>=6,<7",
    "mypy>=1.15,<3",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "types-jsonschema>=4.23,<5",
    "types-pyyaml>=6.0.12,<7",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
