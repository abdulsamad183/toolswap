schema_version: 1.0.0
tool_id: cases.get
version: 1.0.0
input_schema:
  type: object
  properties:
    case_id: {type: string}
  required: [case_id]
  additionalProperties: false
output_schema:
  type: object
  properties:
    case_id: {type: string}
    status: {type: string}
  required: [case_id, status]
  additionalProperties: false
error_schema:
  type: object
  properties:
    code: {type: string}
    message: {type: string}
  required: [code, message]
  additionalProperties: false
side_effect: none
idempotency: natural
authority: [case.read]
requires_confirmation: false
preconditions: [case exists]
postconditions: [result matches the requested case]
failure_modes:
  - {code: not_found, retryable: false}
  - {code: timeout, retryable: true}
verification_tool: null
